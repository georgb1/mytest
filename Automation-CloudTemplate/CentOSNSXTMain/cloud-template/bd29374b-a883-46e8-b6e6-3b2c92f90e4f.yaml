content: |
  ---
  formatVersion: 1
  inputs:
    build:
      type: "string"
      default: "small"
    cpuCount:
      type: "integer"
      description: "Number of virtual processors"
      default: 1
    totalMemoryMB:
      type: "integer"
      description: "Machine virtual memory size in Megabytes"
      default: 1024
    disksize:
      type: "number"
      default: 5
  resources:
    Cloud_vSphere_Disk_1:
      type: "Cloud.vSphere.Disk"
      metadata:
        layoutPosition:
        - 0
        - 1
      properties:
        capacityGb: "${input.disksize}"
    Cloud_vSphere_Machine_1:
      type: "Cloud.vSphere.Machine"
      metadata:
        layoutPosition:
        - 0
        - 2
      properties:
        image: "ubuntu"
        customizationSpec: "Linux"
        cpuCount: "${input.cpuCount}"
        totalMemoryMB: "${input.totalMemoryMB}"
        constraints:
        - tag: "nsx:prod"
        attachedDisks:
        - source: "${resource.Cloud_vSphere_Disk_1.id}"
        networks:
        - network: "${resource.Cloud_NSX_Network_1.id}"
          assignment: "static"
    Cloud_NSX_Network_1:
      type: "Cloud.NSX.Network"
      metadata:
        layoutPosition:
        - 1
        - 0
      properties:
        networkType: "outbound"
        constraints:
        - tag: "nsx:prod"
